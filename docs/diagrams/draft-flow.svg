<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs><style>.bg{fill:#0d1117}.node{fill:#21262d;stroke:#8b949e;stroke-width:2}.hot{fill:#17202a;stroke:#58a6ff;stroke-width:2}.ok{fill:#17261d;stroke:#3fb950;stroke-width:2}.title{fill:#f0f6fc;font:700 30px Arial,sans-serif}.label{fill:#f0f6fc;font:600 18px Arial,sans-serif}.sub{fill:#8b949e;font:15px Arial,sans-serif}.edge{stroke:#c9d1d9;stroke-width:2;fill:none;marker-end:url(#a)}.blue{stroke:#58a6ff;stroke-width:2;fill:none;marker-end:url(#b)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c9d1d9"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/></marker></defs>
  <rect class="bg" width="1400" height="760"/><text class="title" x="40" y="58">Draft Autosave &amp; Persistence Flow</text>
  <rect class="node" x="50" y="180" width="190" height="110" rx="12"/><text class="label" x="91" y="220">React Client</text><text class="sub" x="78" y="250">contentVersion + 1</text><text class="sub" x="89" y="274">Autosave Request</text>
  <rect class="node" x="310" y="180" width="210" height="110" rx="12"/><text class="label" x="354" y="220">Draft API</text><text class="sub" x="341" y="250">User / Draft 검증</text><text class="sub" x="350" y="274">RDB Fallback 조회</text>
  <rect class="hot" x="590" y="150" width="250" height="170" rx="12"/><text class="label" x="642" y="192">Redis Lua Script</text><text class="sub" x="622" y="225">버전·내용 충돌 검증</text><text class="sub" x="623" y="250">Hash 전체 필드 갱신</text><text class="sub" x="616" y="275">TTL 갱신 + ZADD dirty</text><text class="sub" x="626" y="300">단일 원자적 연산</text>
  <rect class="hot" x="920" y="105" width="220" height="105" rx="12"/><text class="label" x="966" y="148">Redis Hash</text><text class="sub" x="949" y="178">draft:{draftId}</text>
  <rect class="hot" x="920" y="260" width="220" height="105" rx="12"/><text class="label" x="952" y="303">Sorted Set</text><text class="sub" x="950" y="333">draft:dirty · score=time</text>
  <rect class="node" x="590" y="465" width="250" height="120" rx="12"/><text class="label" x="625" y="505">Sync Scheduler</text><text class="sub" x="624" y="535">60초 주기 · 최대 100건</text><text class="sub" x="626" y="560">오래된 score부터 조회</text>
  <rect class="ok" x="920" y="465" width="220" height="120" rx="12"/><text class="label" x="975" y="505">MySQL</text><text class="sub" x="958" y="535">Draft 영구 저장</text><text class="sub" x="949" y="560">contentVersion 검증</text>
  <rect class="node" x="1185" y="465" width="170" height="120" rx="12"/><text class="label" x="1221" y="505">Cleanup</text><text class="sub" x="1209" y="535">dirty 조건부 제거</text><text class="sub" x="1210" y="560">Hash TTL 유지</text>
  <path class="edge" d="M240 235 H310"/><path class="edge" d="M520 235 H590"/><path class="blue" d="M840 200 C875 190 880 157 920 157"/><path class="blue" d="M840 270 C875 285 880 312 920 312"/>
  <path class="edge" d="M1030 365 V410 H715 V465"/><text class="sub" x="760" y="400">동기화 대상 조회</text><path class="edge" d="M840 525 H920"/><path class="edge" d="M1140 525 H1185"/>
  <path class="blue" d="M1270 465 C1270 405 1110 410 1030 365"/><text class="sub" x="1120" y="400">version 일치 시 ZREM</text>
  <text class="sub" x="50" y="690">응답 상태: SAVED · IDEMPOTENT · VERSION_CONFLICT · CONTENT_CONFLICT</text>
