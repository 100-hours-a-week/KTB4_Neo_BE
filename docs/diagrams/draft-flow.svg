<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940">
  <defs>
    <style>
      .bg{fill:#0d1117}.node{fill:#21262d;stroke:#8b949e;stroke-width:2}.hash{fill:#17202a;stroke:#58a6ff;stroke-width:2}.zset{fill:#231e16;stroke:#d29922;stroke-width:2}.rdb{fill:#17261d;stroke:#3fb950;stroke-width:2}.cleanup{fill:#241b20;stroke:#f85149;stroke-width:2}.group{fill:#111820;stroke:#30363d;stroke-width:2}.title{fill:#f0f6fc;font:700 32px Arial,sans-serif}.section{fill:#f0f6fc;font:700 20px Arial,sans-serif}.label{fill:#f0f6fc;font:600 17px Arial,sans-serif}.sub{fill:#9da7b3;font:15px Arial,sans-serif}.note{fill:#c9d1d9;font:15px Arial,sans-serif}.edge{stroke:#c9d1d9;stroke-width:2;fill:none;marker-end:url(#a)}.blue{stroke:#58a6ff;stroke-width:2;fill:none;marker-end:url(#b)}.yellow{stroke:#d29922;stroke-width:2;fill:none;marker-end:url(#y)}.green{stroke:#3fb950;stroke-width:2;fill:none;marker-end:url(#g)}.red{stroke:#f85149;stroke-width:2;fill:none;marker-end:url(#r)}.dash{stroke-dasharray:8 7}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c9d1d9"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/></marker>
    <marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d29922"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3fb950"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f85149"/></marker>
  </defs>

  <rect class="bg" width="1500" height="940"/>
  <text class="title" x="40" y="55">Draft Autosave · Sync · Cleanup Flow</text>

  <!-- Autosave group -->
  <rect class="group" x="35" y="90" width="1430" height="285" rx="16"/>
  <text class="section" x="60" y="128">1. 자동 저장 — Redis에 최신 스냅샷과 동기화 대상 등록</text>

  <rect class="node" x="70" y="180" width="190" height="105" rx="12"/>
  <text class="label" x="111" y="220">React Client</text>
  <text class="sub" x="96" y="250">contentVersion + 1</text>

  <rect class="node" x="330" y="180" width="195" height="105" rx="12"/>
  <text class="label" x="383" y="220">Draft API</text>
  <text class="sub" x="361" y="250">사용자 · Draft 검증</text>

  <rect class="node" x="595" y="155" width="250" height="155" rx="12"/>
  <text class="label" x="653" y="193">Redis Lua Script</text>
  <text class="sub" x="631" y="224">버전·내용 충돌 검증</text>
  <text class="sub" x="623" y="250">Hash + TTL + ZADD dirty</text>
  <text class="sub" x="645" y="276">원자적으로 처리</text>

  <rect class="hash" x="930" y="135" width="240" height="130" rx="12"/>
  <text class="label" x="1001" y="175">Redis Hash</text>
  <text class="sub" x="982" y="205">draft:{draftId}</text>
  <text class="sub" x="968" y="232">실제 임시글 전체 데이터</text>

  <rect class="zset" x="1220" y="135" width="210" height="130" rx="12"/>
  <text class="label" x="1260" y="175">Sorted Set</text>
  <text class="sub" x="1252" y="205">draft:dirty</text>
  <text class="sub" x="1245" y="232">ID + 변경 시각만 저장</text>

  <path class="edge" d="M260 232 H330"/>
  <path class="edge" d="M525 232 H595"/>
  <path class="blue" d="M845 200 H930"/>
  <text class="sub" x="865" y="184">HSET · EXPIRE</text>
  <path class="yellow" d="M845 265 C1010 320 1110 300 1220 238"/>
  <text class="sub" x="970" y="315">ZADD(draftId, updatedAt)</text>

  <!-- Sync group -->
  <rect class="group" x="35" y="400" width="1430" height="300" rx="16"/>
  <text class="section" x="60" y="438">2. RDB 동기화 — Sorted Set은 대상 탐색, Hash는 저장할 데이터</text>

  <rect class="node" x="70" y="515" width="220" height="115" rx="12"/>
  <text class="label" x="120" y="555">Sync Scheduler</text>
  <text class="sub" x="104" y="585">1분 주기 · 최대 100건</text>
  <text class="sub" x="113" y="610">오래된 score 우선</text>

  <rect class="zset" x="365" y="500" width="220" height="130" rx="12"/>
  <text class="label" x="412" y="540">Sorted Set 조회</text>
  <text class="sub" x="399" y="570">동기화 대상 Draft ID</text>
  <text class="sub" x="410" y="596">본문 데이터 없음</text>

  <rect class="hash" x="665" y="500" width="220" height="130" rx="12"/>
  <text class="label" x="720" y="540">Hash 조회</text>
  <text class="sub" x="699" y="570">ID별 최신 스냅샷</text>
  <text class="sub" x="704" y="596">contentVersion 확인</text>

  <rect class="rdb" x="965" y="500" width="220" height="130" rx="12"/>
  <text class="label" x="1035" y="540">MySQL</text>
  <text class="sub" x="997" y="570">Draft Snapshot 저장</text>
  <text class="sub" x="1017" y="596">Transaction Commit</text>

  <rect class="node" x="1260" y="500" width="170" height="130" rx="12"/>
  <text class="label" x="1298" y="540">Sync 완료</text>
  <text class="sub" x="1287" y="570">최신 버전 일치 시</text>
  <text class="sub" x="1298" y="596">ZREM dirty</text>

  <path class="yellow" d="M290 565 H365"/>
  <text class="sub" x="298" y="548">ZRANGEBYSCORE</text>
  <path class="edge" d="M585 565 H665"/>
  <text class="sub" x="605" y="548">Draft ID</text>
  <path class="blue" d="M885 565 H965"/>
  <text class="sub" x="899" y="548">Snapshot</text>
  <path class="green" d="M1185 565 H1260"/>
  <path class="yellow dash" d="M1345 500 C1345 455 560 455 475 500"/>
  <text class="sub" x="850" y="472">커밋 후 Redis 최신 버전이 같을 때만 Sorted Set 항목 제거</text>
  <text class="note" x="72" y="675">※ 동기화가 끝나도 Redis Hash는 삭제하지 않으며 TTL 3일 동안 유지됩니다.</text>

  <!-- Cleanup group -->
  <rect class="group" x="35" y="725" width="1430" height="175" rx="16"/>
  <text class="section" x="60" y="763">3. 만료 데이터 정리 — Redis dirty 정리와 별개의 RDB 보존 정책</text>

  <rect class="cleanup" x="270" y="795" width="250" height="80" rx="12"/>
  <text class="label" x="323" y="829">Cleanup Scheduler</text>
  <text class="sub" x="332" y="854">하루 주기 · 최대 100건</text>

  <rect class="rdb" x="650" y="795" width="250" height="80" rx="12"/>
  <text class="label" x="710" y="829">MySQL Drafts</text>
  <text class="sub" x="684" y="854">7일 지난 비활성 Draft 조회</text>

  <rect class="cleanup" x="1030" y="795" width="220" height="80" rx="12"/>
  <text class="label" x="1073" y="829">물리 삭제</text>
  <text class="sub" x="1060" y="854">Redis ZSet과 무관</text>

  <path class="red" d="M520 835 H650"/>
  <path class="red" d="M900 835 H1030"/>
</svg>
