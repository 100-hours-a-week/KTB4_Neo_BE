  <rect class="hot" x="535" y="135" width="190" height="105" rx="12"/><text class="label" x="584" y="177">Docker Build</text><text class="sub" x="574" y="207">latest + commit SHA</text>
  <rect class="hot" x="785" y="135" width="190" height="105" rx="12"/><text class="label" x="829" y="177">Docker Hub</text><text class="sub" x="837" y="207">Image Push</text>
  <rect class="node" x="1035" y="135" width="150" height="105" rx="12"/><text class="label" x="1074" y="177">EC2 SSH</text><text class="sub" x="1058" y="207">compose.yml copy</text>
