<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360">
  <defs><style>.bg{fill:#0d1117}.node{fill:#21262d;stroke:#8b949e;stroke-width:2}.hot{fill:#17202a;stroke:#58a6ff;stroke-width:2}.title{fill:#f0f6fc;font:700 30px Arial,sans-serif}.label{fill:#f0f6fc;font:600 17px Arial,sans-serif}.sub{fill:#8b949e;font:14px Arial,sans-serif}.edge{stroke:#c9d1d9;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c9d1d9"/></marker></defs>
  <rect class="bg" width="1400" height="360"/><text class="title" x="40" y="58">CI/CD Pipeline</text>
  <rect class="node" x="45" y="135" width="180" height="105" rx="12"/><text class="label" x="87" y="177">Git Push</text><text class="sub" x="89" y="207">main branch</text>
